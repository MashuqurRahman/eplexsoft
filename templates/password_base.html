{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>{% block title %}Password{% endblock %} - Ecommerce</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/img/favicon.ico' %}">

    <!-- CSS -->
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/responsive.css' %}">

    {% block extra_css %}
    <style>
        body {
            background-color: #f8f9fa;
        }
        .password-card {
            max-width: 450px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            background: #fff;
        }
        .password-card h4 {
            margin-bottom: 15px;
        }
        .password-card p {
            font-size: 0.9rem;
            color: #6c757d;
        }
        .text-center a {
            text-decoration: none;
            font-size: 14px;
        }
        .text-danger {
            font-size: 0.85rem;
        }
    </style>
    {% endblock %}
</head>

<body>

<section class="login-area">
    <div class="container">
        <div class="row align-items-center">

            <!-- Left Image (optional) -->
            <div class="col-md-6 d-none d-md-block">
                <div class="logining">
                    <img src="{% static 'assets/img/login.svg' %}" alt="password page">
                </div>
            </div>

            <!-- Right Form -->
            <div class="col-md-6">
                <div class="password-card">

                    {% block header %}
                    <!-- Default header, can be overridden -->
                    <h4>Password Page</h4>
                    <p>Use this form to update your password.</p>
                    {% endblock %}

                    {% block content %}
                    <!-- Form goes here -->
                    {% endblock %}

                    <div class="text-center mt-3">
                        <a href="{% url 'user_auth' %}">← Back to Login</a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>

<!-- JS -->
<script src="{% static 'assets/js/code.jquery.com_jquery-3.7.0.min.js' %}"></script>
<script src="{% static 'assets/js/bootstrap.bundle.min.js' %}"></script>

{% block extra_js %}{% endblock %}

</body>
</html>
